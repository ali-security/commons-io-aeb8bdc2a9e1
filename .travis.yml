language: java

cache:
  directories:
    - $HOME/.m2

jdk:
  - openjdk8
  - openjdk11
  - openjdk-ea
  - oraclejdk11

matrix:
  exclude:
    - jdk: openjdk-ea
  include:
    - jdk: openjdk-ea
      env: JACOCO_SKIP=true
    # JDK 14 leg: Travis provisions openjdk14 from apt.bell-sw.com, which no longer
    # carries bellsoft-java14, so install the Zulu 14 GA build by hand instead.
    - jdk: openjdk11
      env: JDK=zulu14
      before_install:
        - curl -fsSL -o $HOME/jdk14.tar.gz https://cdn.azul.com/zulu/bin/zulu14.29.23-ca-jdk14.0.2-linux_x64.tar.gz
        - mkdir -p $HOME/jdk14 && tar -xzf $HOME/jdk14.tar.gz -C $HOME/jdk14 --strip-components=1
        - export JAVA_HOME=$HOME/jdk14
        - export PATH=$JAVA_HOME/bin:$PATH
        - java -version

# --no-transfer-progress requires Maven 3.6.1+. Otherwise use --batch-mode
script:
  - mvn -V --no-transfer-progress -Drat.skip=true -Djapicmp.skip=true -Dcheckstyle.skip=true -Djacoco.skip=true

# Surefire only prints a per-class skip count; list each skipped test and its skip message.
after_script:
  - echo "Skipped tests (testcase + <skipped message>) from target/surefire-reports:"
  - grep -h -B1 '<skipped' target/surefire-reports/TEST-*.xml
  - |
    if grep -q 'Assumption failed' target/surefire-reports/TEST-*.xml; then
      echo "Assumption that skipped each test above (first assume* call in the test method):"
      grep -h -B1 'Assumption failed' target/surefire-reports/TEST-*.xml | sed -n 's/.*<testcase name="\([^"]*\)" classname="\([^"]*\)".*/\2 \1/p' | while read cls name; do
        echo "$cls.$name skipped by: $(awk -v m="void $name(" 'index($0,m){f=1} f&&/assume/{print;exit}' "src/test/java/$(echo "$cls" | tr . /).java")"
      done
    fi
